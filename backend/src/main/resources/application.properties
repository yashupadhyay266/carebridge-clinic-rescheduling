server.port=8080
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/carebridge}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.hikari.data-source-properties.options=-c TimeZone=UTC
spring.flyway.enabled=true
carebridge.demo-data.enabled=${CAREBRIDGE_DEMO_DATA_ENABLED:true}
llm.base-url=${LLM_BASE_URL:https://litellm-qc.zycus.net/v1/chat/completions}
llm.api-key=${LLM_API_KEY:}
llm.model=${LLM_MODEL:gpt-5.6-luna-azure-payg-global}
llm.product=${LLM_PRODUCT:PC1}
